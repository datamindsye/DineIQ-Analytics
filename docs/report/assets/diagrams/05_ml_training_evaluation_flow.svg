<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <text x="500" y="32" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">DineIQ Analytics — Chronological Split &amp; Model Selection Flow</text>
  <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-size="11.5">Strict Time-Aware Splits • Multi-Model Tournament • Champion Selection</text>

  <!-- Chronological Timeline Bar -->
  <g transform="translate(50, 75)">
    <rect x="0" y="0" width="900" height="35" rx="6" fill="#1e293b" stroke="#334155"/>
    <rect x="5" y="5" width="445" height="25" rx="4" fill="#1e3a8a"/>
    <text x="225" y="22" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="700">TRAINING SPLIT (Months 1–6: Days 1–180)</text>

    <rect x="455" y="5" width="175" height="25" rx="4" fill="#065f46"/>
    <text x="542" y="22" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="700">VALIDATION (Mo 7–8)</text>

    <rect x="635" y="5" width="130" height="25" rx="4" fill="#854d0e"/>
    <text x="700" y="22" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="700">TEST (Mo 9–10)</text>

    <rect x="770" y="5" width="125" height="25" rx="4" fill="#581c87"/>
    <text x="832" y="22" text-anchor="middle" fill="#e9d5ff" font-size="10.5" font-weight="700">UNSEEN (Mo 11–12)</text>
  </g>

  <!-- Pipeline 1: 3-Model Tournament -->
  <g transform="translate(50, 140)">
    <rect x="0" y="0" width="430" height="170" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="20" y="25" fill="#38bdf8" font-size="12" font-weight="700">1. Algorithm Tournament (Per Task)</text>
    <text x="20" y="48" fill="#cbd5e1" font-size="10.5">Train 3 candidate algorithms on Training Split:</text>
    
    <rect x="20" y="60" width="390" height="28" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="78" fill="#94a3b8" font-size="10">Candidate A: Baseline (Linear / Logistic / KMeans)</text>

    <rect x="20" y="94" width="390" height="28" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="112" fill="#94a3b8" font-size="10">Candidate B: Bagging Ensemble (Random Forest)</text>

    <rect x="20" y="128" width="390" height="28" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="146" fill="#94a3b8" font-size="10">Candidate C: Boosting Ensemble (Gradient Boosted Trees)</text>
  </g>

  <!-- Arrow -->
  <path d="M 480 225 L 520 225" stroke="#38bdf8" stroke-width="2"/>

  <!-- Step 2: Validation & Selection -->
  <g transform="translate(520, 140)">
    <rect x="0" y="0" width="430" height="170" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="25" fill="#34d399" font-size="12" font-weight="700">2. Metric Evaluation &amp; Champion Selection</text>
    <text x="20" y="48" fill="#cbd5e1" font-size="10.5">Evaluate candidates on Validation Split:</text>
    <text x="20" y="72" fill="#94a3b8" font-size="10">• Regression Tasks: RMSE, MAE, R²</text>
    <text x="20" y="90" fill="#94a3b8" font-size="10">• Classification Tasks: ROC-AUC, F1-Score, Precision, Recall</text>
    <text x="20" y="108" fill="#94a3b8" font-size="10">• Clustering Tasks: Silhouette Score (Cosine distance)</text>
    <rect x="20" y="125" width="390" height="32" rx="4" fill="#064e3b" stroke="#059669"/>
    <text x="215" y="146" text-anchor="middle" fill="#a7f3d0" font-size="10.5" font-weight="700">Select Best Performing Model as "Champion"</text>
  </g>

  <!-- Step 3: Out-of-Sample Test & Cross-Pipeline Agreement -->
  <g transform="translate(50, 335)">
    <rect x="0" y="0" width="900" height="120" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="20" y="25" fill="#c084fc" font-size="12" font-weight="700">3. Out-of-Sample Generalization Test &amp; Cross-Pipeline Agreement</text>
    <text x="20" y="50" fill="#cbd5e1" font-size="10.5">• Evaluate Champion on Holdout Test Split to confirm generalization and detect overfitting</text>
    <text x="20" y="70" fill="#cbd5e1" font-size="10.5">• Compare Spark Champion predictions vs Python Champion predictions on the Unseen Split (Months 11–12)</text>
    <text x="20" y="90" fill="#cbd5e1" font-size="10.5">• Compute Task-level and Overall Cross-Pipeline Agreement: empirical baseline is 63.48%</text>
    <text x="20" y="108" fill="#a855f7" font-size="10" font-weight="600">Materialize scorecard to data/marts/comparison/ and register champion metadata in PostgreSQL model_versions.</text>
  </g>
</svg>