<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <text x="500" y="35" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="700">DineIQ Analytics — Dual Pipeline Independence &amp; Comparison Architecture</text>
  <text x="500" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Strict Pipeline Isolation • Shared Contracts Only • Zero Feature / Weight Leakage</text>

  <!-- Shared Clean Artifacts Top Box -->
  <rect x="250" y="80" width="500" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="500" y="105" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">SHARED CONTRACTS &amp; SNAPSHOTS (Read-Only)</text>
  <text x="500" y="125" text-anchor="middle" fill="#cbd5e1" font-size="10.5">Clean Parquet Tables (data/cleaned/) • Entity IDs • Split Manifests (TRAIN, VAL, TEST, UNSEEN)</text>

  <!-- Left Branch: Apache Spark MLlib Pipeline -->
  <rect x="50" y="170" width="420" height="260" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="50" y="170" width="420" height="28" rx="4" fill="#b45309"/>
  <text x="260" y="189" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">SPARK MLLIB PIPELINE (packages/pipeline_spark)</text>

  <g transform="translate(70, 210)">
    <text x="0" y="15" fill="#f1f5f9" font-size="11" font-weight="600">Feature Engineering:</text>
    <text x="15" y="32" fill="#94a3b8" font-size="10">• PySpark SQL &amp; VectorAssembler</text>
    <text x="15" y="47" fill="#94a3b8" font-size="10">• StandardScaler, StringIndexer, OneHotEncoderEstimator</text>

    <text x="0" y="75" fill="#f1f5f9" font-size="11" font-weight="600">Model Candidates (Multi-Algorithm Tournament):</text>
    <text x="15" y="92" fill="#cbd5e1" font-size="10">• Demand: LinearRegression vs RandomForest vs GBTRegressor</text>
    <text x="15" y="107" fill="#cbd5e1" font-size="10">• Wastage Risk: LogisticRegression vs RandomForest vs GBT</text>
    <text x="15" y="122" fill="#cbd5e1" font-size="10">• Churn Risk: LogisticRegression vs RandomForest vs GBT</text>
    <text x="15" y="137" fill="#cbd5e1" font-size="10">• Segmentation: KMeans vs BisectingKMeans (k=4)</text>

    <text x="0" y="165" fill="#f1f5f9" font-size="11" font-weight="600">Materialized Outputs:</text>
    <text x="15" y="182" fill="#fbbf24" font-size="10">• data/marts/spark/ml_*.parquet</text>
    <text x="15" y="197" fill="#fbbf24" font-size="10">• data/artifacts/models/spark/*</text>
  </g>

  <!-- Right Branch: Independent Python Scikit-Learn Pipeline -->
  <rect x="530" y="170" width="420" height="260" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="530" y="170" width="420" height="28" rx="4" fill="#047857"/>
  <text x="740" y="189" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">INDEPENDENT PYTHON PIPELINE (packages/pipeline_python)</text>

  <g transform="translate(550, 210)">
    <text x="0" y="15" fill="#f1f5f9" font-size="11" font-weight="600">Feature Engineering:</text>
    <text x="15" y="32" fill="#94a3b8" font-size="10">• Pandas &amp; Scikit-Learn ColumnTransformer</text>
    <text x="15" y="47" fill="#94a3b8" font-size="10">• StandardScaler, RobustScaler, OneHotEncoder</text>

    <text x="0" y="75" fill="#f1f5f9" font-size="11" font-weight="600">Model Candidates (Multi-Algorithm Tournament):</text>
    <text x="15" y="92" fill="#cbd5e1" font-size="10">• Demand: Ridge vs RandomForest vs GradientBoosting</text>
    <text x="15" y="107" fill="#cbd5e1" font-size="10">• Wastage Risk: LogReg vs RandomForest vs GradientBoosting</text>
    <text x="15" y="122" fill="#cbd5e1" font-size="10">• Churn Risk: LogReg vs RandomForest vs GradientBoosting</text>
    <text x="15" y="137" fill="#cbd5e1" font-size="10">• Segmentation: KMeans vs GaussianMixture (k=4)</text>

    <text x="0" y="165" fill="#f1f5f9" font-size="11" font-weight="600">Materialized Outputs:</text>
    <text x="15" y="182" fill="#34d399" font-size="10">• data/marts/python/ml_*.parquet</text>
    <text x="15" y="197" fill="#34d399" font-size="10">• data/artifacts/models/python/*</text>
  </g>

  <!-- Connectors from Top -->
  <path d="M 380 140 L 260 170" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 620 140 L 740 170" stroke="#38bdf8" stroke-width="2"/>

  <!-- Bottom: Comparison Arena Box -->
  <path d="M 260 430 L 400 455" stroke="#f59e0b" stroke-width="2"/>
  <path d="M 740 430 L 600 455" stroke="#10b981" stroke-width="2"/>

  <rect x="200" y="450" width="600" height="55" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="500" y="472" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">CROSS-PIPELINE COMPARISON ARENA (packages/comparison)</text>
  <text x="500" y="492" text-anchor="middle" fill="#cbd5e1" font-size="10.5">Evaluates Head-to-Head on Unseen Split: 63.48% Agreement • Scorecard Materialization</text>
</svg>