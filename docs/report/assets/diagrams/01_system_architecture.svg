<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">DineIQ Analytics — Modular Monolith System Architecture</text>
  <text x="550" y="62" text-anchor="middle" fill="#94a3b8" font-size="12">Strict Architectural Boundary Separation • Zero Prohibited Distributed Services</text>

  <!-- Layer 1: Presentation Layer (React 19 + TypeScript + Vite + Plotly) -->
  <rect x="50" y="85" width="1000" height="95" rx="8" fill="url(#boxBlue)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="85" width="180" height="24" rx="4" fill="#0284c7"/>
  <text x="60" y="101" fill="#ffffff" font-size="11" font-weight="700">PRESENTATION LAYER</text>
  <text x="960" y="101" fill="#38bdf8" font-size="11" font-weight="600">React 19 • Vite • Plotly.js</text>

  <g transform="translate(65, 118)">
    <rect x="0" y="0" width="150" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="75" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Executive &amp; Sales</text>
    <text x="75" y="38" text-anchor="middle" fill="#64748b" font-size="9.5">KPI Cards • Plotly Charts</text>
    
    <rect x="162" y="0" width="150" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="237" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Menu &amp; Basket BI</text>
    <text x="237" y="38" text-anchor="middle" fill="#64748b" font-size="9.5">BCG Matrix • Affinity Rules</text>

    <rect x="324" y="0" width="150" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="399" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Customer Intelligence</text>
    <text x="399" y="38" text-anchor="middle" fill="#64748b" font-size="9.5">RFM Grid • Churn Risk</text>

    <rect x="486" y="0" width="150" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="561" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Wastage &amp; Demand</text>
    <text x="561" y="38" text-anchor="middle" fill="#64748b" font-size="9.5">Dual-Path • Spoilage Risk</text>

    <rect x="648" y="0" width="150" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="723" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Data Science Arena</text>
    <text x="723" y="38" text-anchor="middle" fill="#64748b" font-size="9.5">Spark vs Python Scorecard</text>

    <rect x="810" y="0" width="160" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="890" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">What-If &amp; Recomms</text>
    <text x="890" y="38" text-anchor="middle" fill="#64748b" font-size="9.5">Elasticity Simulator</text>
  </g>

  <!-- Communication Arrow -->
  <path d="M 550 180 L 550 205" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="565" y="198" fill="#94a3b8" font-size="10">HTTP / REST (JWT Bearer Token)</text>

  <!-- Layer 2: API & Application Services Layer (FastAPI) -->
  <rect x="50" y="210" width="1000" height="115" rx="8" fill="url(#boxBlue)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="210" width="180" height="24" rx="4" fill="#059669"/>
  <text x="60" y="226" fill="#ffffff" font-size="11" font-weight="700">APPLICATION &amp; API LAYER</text>
  <text x="940" y="226" fill="#10b981" font-size="11" font-weight="600">FastAPI • Uvicorn • Pydantic</text>

  <g transform="translate(65, 245)">
    <rect x="0" y="0" width="185" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="92" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Auth &amp; RBAC Engine</text>
    <text x="92" y="38" text-anchor="middle" fill="#94a3b8" font-size="9.5">OAuth2 Password Bearer</text>
    <text x="92" y="52" text-anchor="middle" fill="#64748b" font-size="9">Admin • Manager • Scientist • Cashier</text>

    <rect x="198" y="0" width="185" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="290" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Analytics Mart Service</text>
    <text x="290" y="38" text-anchor="middle" fill="#94a3b8" font-size="9.5">PyArrow Columnar Reader</text>
    <text x="290" y="52" text-anchor="middle" fill="#64748b" font-size="9">Path-traversal safe • Sub-50ms scans</text>

    <rect x="396" y="0" width="185" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="488" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Decision Intelligence</text>
    <text x="488" y="38" text-anchor="middle" fill="#94a3b8" font-size="9.5">Actionable Recommendations</text>
    <text x="488" y="52" text-anchor="middle" fill="#64748b" font-size="9">Dynamic What-If Elasticity Sim</text>

    <rect x="594" y="0" width="185" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="686" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Job Orchestration</text>
    <text x="686" y="38" text-anchor="middle" fill="#94a3b8" font-size="9.5">Subprocess Pipeline Invoker</text>
    <text x="686" y="52" text-anchor="middle" fill="#64748b" font-size="9">Async job tracking via PostgreSQL</text>

    <rect x="792" y="0" width="178" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="881" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Audit &amp; Compliance</text>
    <text x="881" y="38" text-anchor="middle" fill="#94a3b8" font-size="9.5">AuditEvent Logger</text>
    <text x="881" y="52" text-anchor="middle" fill="#64748b" font-size="9">Immutable security audit trails</text>
  </g>

  <!-- Connectors -->
  <path d="M 300 325 L 300 355" stroke="#f59e0b" stroke-width="2"/>
  <path d="M 800 325 L 800 355" stroke="#a855f7" stroke-width="2"/>

  <!-- Layer 3: Persistence & Storage Layer (PostgreSQL + Snappy Parquet) -->
  <rect x="50" y="355" width="480" height="235" rx="8" fill="url(#boxBlue)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="355" width="220" height="24" rx="4" fill="#d97706"/>
  <text x="60" y="371" fill="#ffffff" font-size="11" font-weight="700">OPERATIONAL &amp; METADATA DB</text>
  <text x="440" y="371" fill="#f59e0b" font-size="11" font-weight="600">PostgreSQL 18</text>

  <g transform="translate(70, 395)">
    <rect x="0" y="0" width="205" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="10" y="22" fill="#f1f5f9" font-size="11" font-weight="600">Security &amp; RBAC</text>
    <text x="10" y="40" fill="#94a3b8" font-size="9">users • roles • permissions</text>
    <text x="10" y="55" fill="#94a3b8" font-size="9">user_roles • role_permissions</text>

    <rect x="225" y="0" width="205" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="10" y="22" fill="#f1f5f9" font-size="11" font-weight="600">Operational Metadata</text>
    <text x="10" y="40" fill="#94a3b8" font-size="9">job_runs • audit_events</text>
    <text x="10" y="55" fill="#94a3b8" font-size="9">model_versions • recommendations</text>

    <rect x="0" y="85" width="430" height="90" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="10" y="22" fill="#f1f5f9" font-size="11" font-weight="600">11 Domain Relational Tables (Sample &amp; Schema Validation)</text>
    <text x="10" y="42" fill="#94a3b8" font-size="9.5">restaurants • menu_categories • menu_items • pricing_history (SCD-2)</text>
    <text x="10" y="58" fill="#94a3b8" font-size="9.5">customers • promotions • orders • order_items • ratings</text>
    <text x="10" y="74" fill="#94a3b8" font-size="9.5">inventory • wastage (Dual-path: preparation + spoiled)</text>
  </g>

  <!-- Layer 4: Big Data & Machine Learning Layer -->
  <rect x="560" y="355" width="490" height="235" rx="8" fill="url(#boxBlue)" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="560" y="355" width="220" height="24" rx="4" fill="#7e22ce"/>
  <text x="570" y="371" fill="#ffffff" font-size="11" font-weight="700">BIG DATA &amp; DUAL ML ARENA</text>
  <text x="965" y="371" fill="#a855f7" font-size="11" font-weight="600">Spark + Scikit-Learn</text>

  <g transform="translate(580, 395)">
    <rect x="0" y="0" width="215" height="80" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="10" y="22" fill="#f1f5f9" font-size="11" font-weight="600">Apache Spark 4.2.0 Engine</text>
    <text x="10" y="40" fill="#94a3b8" font-size="9">PySpark DataFrame &amp; Spark SQL</text>
    <text x="10" y="55" fill="#94a3b8" font-size="9">Windowing: rowsBetween(-14, -1)</text>
    <text x="10" y="70" fill="#38bdf8" font-size="9">12 Precomputed Analytical Marts</text>

    <rect x="235" y="0" width="215" height="80" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="10" y="22" fill="#f1f5f9" font-size="11" font-weight="600">Dual ML Tournament</text>
    <text x="10" y="40" fill="#94a3b8" font-size="9">Spark MLlib (Reg, RF, GBT)</text>
    <text x="10" y="55" fill="#94a3b8" font-size="9">Python Scikit-Learn (Ridge, RF, GBR)</text>
    <text x="10" y="70" fill="#10b981" font-size="9">Strict Time Splits: TRAIN/VAL/TEST</text>

    <rect x="0" y="95" width="450" height="80" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="10" y="22" fill="#f1f5f9" font-size="11" font-weight="600">Analytical Storage Layer (Apache Parquet / Snappy)</text>
    <text x="10" y="42" fill="#94a3b8" font-size="9.5">Clean Data Snapshots (1.30M rows) • Defect Quarantine (9,044 rows)</text>
    <text x="10" y="58" fill="#94a3b8" font-size="9.5">12 Spark Analytical Marts (741,310 rows) • 8 ML Prediction Marts</text>
    <text x="10" y="74" fill="#a855f7" font-size="9.5">Cross-Pipeline Evaluation Marts &amp; Head-to-Head Agreement Matrix</text>
  </g>
</svg>